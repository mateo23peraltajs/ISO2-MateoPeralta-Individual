<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupos de Trabajo - Seguridad TP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/dashboard}">
            <i class="bi bi-shield-check me-2"></i>Seguridad & Auditoría
        </a>
        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/grupos}">Grupos de Trabajo</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">

    <div class="row g-4">
        
        <!-- Formulario Crear Grupo -->
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">Crear Nuevo Grupo</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/grupos/crear}" method="post">
                        <div class="mb-3">
                            <label for="nombreGrupo" class="form-label fw-semibold">Nombre del Grupo</label>
                            <input type="text" class="form-control" id="nombreGrupo" name="nombreGrupo" 
                                   placeholder="Ej. Operaciones Mendoza" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 rounded-3 fw-bold">
                            <i class="bi bi-plus-circle me-1"></i>Crear Grupo
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Listado de Grupos y Miembros (Agregación) -->
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0">Grupos de Trabajo y Miembros</h5>
                </div>
                <div class="card-body">
                    
                    <div th:if="${#lists.isEmpty(grupos)}" class="alert alert-info">
                        No hay grupos de trabajo registrados actualmente.
                    </div>

                    <div th:each="grupo : ${grupos}" class="border rounded-3 p-3 mb-4 bg-white shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold text-primary mb-0">
                                <i class="bi bi-people-fill me-2"></i><span th:text="${grupo.nombreGrupo}">Grupo</span>
                            </h5>
                            <span class="badge bg-secondary" th:text="${grupo.grupo.size()} + ' miembros'">0 miembros</span>
                        </div>

                        <!-- Lista de usuarios pertenecientes al grupo -->
                        <ul class="list-group list-group-flush mb-3">
                            <li th:each="integrante : ${grupo.grupo}" 
                                class="list-group-item d-flex justify-content-between align-items-center px-0">
                                <span th:text="${integrante.correo}">usuario@mail.com</span>
                                <!-- Formulario removerUsuario(u) -->
                                <form th:action="@{/grupos/{gId}/remover-usuario/{uId}(gId=${grupo.id}, uId=${integrante.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-trash"></i> Remover
                                    </button>
                                </form>
                            </li>
                            <li th:if="${#lists.isEmpty(grupo.grupo)}" class="list-group-item text-muted px-0">
                                Sin integrantes asignados.
                            </li>
                        </ul>

                        <!-- Formulario agregarUsuario(u) -->
                        <form th:action="@{/grupos/{gId}/agregar-usuario(gId=${grupo.id})}" method="post" class="row g-2">
                            <div class="col-8">
                                <select name="usuarioId" class="form-select form-select-sm" required>
                                    <option value="" disabled selected>Seleccionar usuario para agregar...</option>
                                    <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.correo}"></option>
                                </select>
                            </div>
                            <div class="col-4">
                                <button type="submit" class="btn btn-sm btn-success w-100">
                                    <i class="bi bi-person-plus"></i> Asignar
                                </button>
                            </div>
                        </form>

                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
