<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Seguridad TP</title>
    <!-- Framework CSS: Bootstrap 5 vía CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5">
            
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body p-4 p-sm-5">
                    
                    <div class="text-center mb-4">
                        <i class="bi bi-shield-lock-fill text-primary" style="font-size: 3rem;"></i>
                        <h3 class="fw-bold mt-2">Acceso al Sistema</h3>
                        <p class="text-muted small">Arquitectura MVC - Seguridad y Auditoría</p>
                    </div>

                    <!-- Mensaje de error dinámico inyectado por el Controller -->
                    <!-- th:if evalúa si el atributo 'error' existe en el Model -->
                    <!-- th:text renderiza el contenido textual seguro -->
                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center rounded-3 mb-4" role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                        <div th:text="${error}">Mensaje de error</div>
                    </div>

                    <!-- Formulario procesado por AuthController (@PostMapping("/login")) -->
                    <form th:action="@{/login}" method="post">
                        
                        <div class="mb-3">
                            <label for="correo" class="form-label fw-semibold">Correo Electrónico</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="correo" name="correo" 
                                       placeholder="admin@empresa.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="clave" class="form-label fw-semibold">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="clave" name="clave" 
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">
                                Ingresar
                            </button>
                        </div>
                    </form>

                    <div class="mt-4 text-center border-top pt-3 text-muted small">
                        <p class="mb-1"><strong>Usuarios de prueba (Clave: 1234):</strong></p>
                        <span>admin@empresa.com | juan.perez@gmail.com</span>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
