<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Gestión de Productos</title>
    <!-- Utilizando Bootstrap 5 vía CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center vh-100">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Gestión de Productos</h4>
                    <p class="mb-0">Por favor, inicie sesión</p>
                </div>
                <div class="card-body p-4">
                    <!-- Mensaje de error de Spring Security -->
                    <div th:if="${param.error}" class="alert alert-danger">
                        Usuario o contraseña inválidos.
                    </div>
                    <!-- Mensaje de logout -->
                    <div th:if="${param.logout}" class="alert alert-success">
                        Ha cerrado sesión exitosamente.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Usuario</label>
                            <input type="text" id="username" name="username" class="form-control" required autofocus placeholder="Ej: admin">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" required placeholder="Ej: 1234">
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Entrar al Sistema</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
