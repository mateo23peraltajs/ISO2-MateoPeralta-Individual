<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lista de Productos</title>
    <!-- Utilizando Bootstrap 5 vía CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

<!-- Navbar de navegación y cierre de sesión -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema ERP</a>
        <div class="d-flex align-items-center">
            <span class="text-light me-3" th:text="'Bienvenido, ' + ${#authentication.name}"></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Listado de Productos</h2>
        <a th:href="@{/productos/nuevo}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Nuevo Producto</a>
    </div>

    <!-- Tabla iterando la lista de Productos -->
    <div class="table-responsive shadow-sm">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-primary">
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Tipo</th>
                <th>Precio</th>
                <th>Stock (F)</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <!-- iteración con Thymeleaf -->
            <tr th:each="producto : ${productos}">
                <td th:text="${producto.codigo}"></td>
                <td th:text="${producto.nombre}"></td>
                <td>
                    <span th:if="${producto.tipoProducto == 'FISICO'}" class="badge bg-secondary">Físico</span>
                    <span th:if="${producto.tipoProducto == 'DIGITAL'}" class="badge bg-info text-dark">Digital</span>
                </td>
                <td th:text="${'$' + producto.precioVenta}"></td>
                <td th:text="${producto.tipoProducto == 'FISICO'} ? ${producto.stock} : '-'"></td>
                <td>
                    <!-- Botones de Acción (Modificación y Baja Lógica) -->
                    <a th:href="@{/productos/editar/{id}(id=${producto.id})}" class="btn btn-warning btn-sm" title="Editar">
                        <i class="bi bi-pencil"></i> Editar
                    </a>
                    <a th:href="@{/productos/eliminar/{id}(id=${producto.id})}" class="btn btn-danger btn-sm" 
                       onclick="return confirm('¿Está seguro de eliminar este producto?');" title="Eliminar">
                        <i class="bi bi-trash"></i> Eliminar
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(productos)}">
                <td colspan="6" class="text-center text-muted">No hay productos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
